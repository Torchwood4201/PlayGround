<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>

<div id="boot">🍟 loading kitchen…</div>
<script type="module">
import * as THREE from 'three';

/* ================= AUDIO (synth, no assets) ================= */
let AC=null;
function beep(f=660,d=.12,t='square',v=.13){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);
    o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d);
  }catch(e){}
}
const sfx={
  drop(){beep(220,.15,'sawtooth',.11)},
  ready(){beep(880,.16,'square',.13);setTimeout(()=>beep(1174,.2,'square',.11),130)},
  cash(){beep(1320,.1,'square',.13);setTimeout(()=>beep(1760,.22,'square',.12),90)},
  bad(){beep(160,.3,'sawtooth',.14)},
  pop(){beep(520,.07,'sine',.11)}
};

/* ================= RENDERER / SCENE (lit + rendered + post) ================= */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;   // post-process stage
renderer.toneMappingExposure=1.12;
renderer.outputColorSpace=THREE.SRGBColorSpace;

/* ---- STAGE 13: post-processing chain (bloom + grade/vignette + output) ---- */
const GradeShader={
  uniforms:{tDiffuse:{value:null},uVig:{value:.32},uSat:{value:1.12},uWarm:{value:.06}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tDiffuse;uniform float uVig,uSat,uWarm;varying vec2 vUv;
    void main(){vec4 c=texture2D(tDiffuse,vUv);
    float g=dot(c.rgb,vec3(.299,.587,.114));c.rgb=mix(vec3(g),c.rgb,uSat);
    c.rgb+=vec3(uWarm,-uWarm*.4,-uWarm*.6)*.35;
    vec2 d=vUv-.5;float v=smoothstep(.85,.25,dot(d,d)*2.);
    c.rgb*=mix(1.-uVig,1.,v);gl_FragColor=c;}`
};
let composer=null,bloomPass=null,postOK=false;
// default OFF on small/high-dpr phones to hold fps (plan risk mitigation)
let postOn=!(Math.min(innerWidth,innerHeight)<550&&devicePixelRatio>2.5);
async function initPost(){ // deferred: scene+camera must exist first
  try{
    const [{EffectComposer},{RenderPass},{UnrealBloomPass},{ShaderPass},{OutputPass}]=await Promise.all([
      import('three/addons/postprocessing/EffectComposer.js'),
      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),
      import('three/addons/postprocessing/ShaderPass.js'),
      import('three/addons/postprocessing/OutputPass.js')]);
    composer=new EffectComposer(renderer);
    composer.setPixelRatio(Math.min(devicePixelRatio,1.5));
    composer.addPass(new RenderPass(scene,camera));
    bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth/2,innerHeight/2),0.35,0.6,0.85);
    composer.addPass(bloomPass);
    composer.addPass(new ShaderPass(GradeShader));
    composer.addPass(new OutputPass());
    postOK=true;
    drawPipeReadout(); // init is async: refresh the stale N/A readout
    if(typeof pipePost!=='undefined')setBtnLabel(pipePost,postOn?'✨ POST ON':'✨ POST OFF',postOn?'#2e7d32':'#9e9e9e');
  }catch(err){ postOK=false; composer=null; }
}
app.appendChild(renderer.domElement);
document.getElementById('boot').style.opacity='0';
setTimeout(()=>document.getElementById('boot').remove(),500);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x141009);
scene.fog=new THREE.Fog(0x141009,9,24);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,60);
let yaw=0,pitch=-.06;
const camBase=new THREE.Vector3(0,1.66,2.65);
camera.rotation.order='YXZ';
function applyCam(){camera.position.copy(camBase);camera.rotation.set(pitch,yaw,0);}
applyCam();

// lights
scene.add(new THREE.HemisphereLight(0xfff1d6,0x3a281a,.85));
const sun=new THREE.DirectionalLight(0xffffff,1.35);
sun.position.set(3.5,6.5,2.5);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-7;sun.shadow.camera.right=7;sun.shadow.camera.top=7;sun.shadow.camera.bottom=-7;
scene.add(sun);
const warm=new THREE.PointLight(0xffb45e,14,11);warm.position.set(0,2.7,-.3);scene.add(warm);
const cool=new THREE.PointLight(0x88aaff,5,10);cool.position.set(-3.4,2.4,-4.2);scene.add(cool);
const grillGlow=new THREE.PointLight(0xff5a1f,0,3);grillGlow.position.set(0,1.35,.7);scene.add(grillGlow);
initPost(); // stage 13: build composer chain once scene+camera exist
// SwiftShader/context-loss safety: composer targets can die on context loss — fall back to direct render
renderer.domElement.addEventListener('webglcontextlost',(e)=>{
  e.preventDefault();composer=null;postOK=false;bloomPass=null;drawPipeReadout();
});

/* ================= PROCEDURAL TEXTURES (texture/material stage) ================= */
function canvasTex(w,h,draw,rx=1,ry=1){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);
  t.anisotropy=4;
  return {tex:t,canvas:c};
}
function rr(g,x,y,w,h,r){ // roundRect fallback
  if(g.roundRect){g.beginPath();g.roundRect(x,y,w,h,r);}else{g.beginPath();g.rect(x,y,w,h);}
}
const floorT=canvasTex(256,256,(g)=>{
  g.fillStyle='#4d3d2b';g.fillRect(0,0,256,256);
  g.fillStyle='#453522';g.fillRect(0,0,128,128);g.fillRect(128,128,128,128);
  g.fillStyle='rgba(0,0,0,.15)';
  for(let i=0;i<300;i++)g.fillRect(Math.random()*256,Math.random()*256,2,2);
  g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=4;g.strokeRect(0,0,256,256);
},7,7);
const wallT=canvasTex(256,256,(g)=>{
  g.fillStyle='#7d6448';g.fillRect(0,0,256,256);
  g.fillStyle='#6e5741';g.fillRect(0,150,256,106);
  g.fillStyle='rgba(255,255,255,.08)';g.fillRect(0,140,256,10);
  g.fillStyle='rgba(0,0,0,.12)';
  for(let i=0;i<200;i++)g.fillRect(Math.random()*256,Math.random()*256,2,2);
},4,2);
const woodT=canvasTex(256,128,(g)=>{
  const gr=g.createLinearGradient(0,0,0,128);
  gr.addColorStop(0,'#e6bd7c');gr.addColorStop(1,'#c08b47');
  g.fillStyle=gr;g.fillRect(0,0,256,128);
  g.strokeStyle='rgba(120,70,20,.35)';g.lineWidth=2;
  for(let i=0;i<9;i++){g.beginPath();const y=8+i*14;
    g.moveTo(0,y);g.bezierCurveTo(80,y+4,170,y-4,256,y);g.stroke();}
},3,1);
const bunT=canvasTex(128,128,(g)=>{
  g.fillStyle='#e8a94e';g.fillRect(0,0,128,128);
  g.fillStyle='#f7d38a';
  for(let i=0;i<26;i++){g.beginPath();g.ellipse(Math.random()*128,Math.random()*128,6,4,Math.random()*3,0,7);g.fill();}
});
const cartonT=canvasTex(128,128,(g)=>{
  g.fillStyle='#cf3527';g.fillRect(0,0,128,128);
  g.fillStyle='#f5f0e6';
  for(let i=0;i<4;i++)g.fillRect(10+i*32,0,12,128);
  g.fillStyle='#cf3527';g.font='bold 26px system-ui';g.textAlign='center';
  g.fillText('FRIES',64,70);
});
const cupT=canvasTex(128,128,(g)=>{
  g.fillStyle='#f7f3ea';g.fillRect(0,0,128,128);
  g.fillStyle='#e0392b';g.fillRect(0,44,128,40);
  g.fillStyle='#fff';g.font='bold 22px system-ui';g.textAlign='center';g.fillText('SODA',64,73);
});
const grateT=canvasTex(128,128,(g)=>{
  g.fillStyle='#1c1c1c';g.fillRect(0,0,128,128);
  g.strokeStyle='#4a4a4a';g.lineWidth=5;
  for(let i=0;i<=4;i++){g.beginPath();g.moveTo(0,i*32);g.lineTo(128,i*32);g.stroke();
    g.beginPath();g.moveTo(i*32,0);g.lineTo(i*32,128);g.stroke();}
},2,2);

/* ================= STAGE 8: generated PBR maps (rough/metal/normal/AO) ================= */
function dataTex(canvas){ // data maps stay linear (no sRGB)
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;
}
function ensureUV1(geo){ // aoMap needs a second UV set
  if(geo&&geo.attributes.uv&&!geo.attributes.uv1)geo.setAttribute('uv1',geo.attributes.uv.clone());
}
function makePBRMaps(){
  const SZ=128;
  // height field: soft random blobs
  const hc=document.createElement('canvas');hc.width=hc.height=SZ;
  const hg=hc.getContext('2d');
  hg.fillStyle='#808080';hg.fillRect(0,0,SZ,SZ);
  for(let i=0;i<60;i++){
    const r=4+Math.random()*14,x=Math.random()*SZ,y=Math.random()*SZ;
    const gr=hg.createRadialGradient(x,y,0,x,y,r);
    const v=Math.floor(90+Math.random()*80);
    gr.addColorStop(0,`rgb(${v},${v},${v})`);gr.addColorStop(1,'rgba(128,128,128,0)');
    hg.fillStyle=gr;hg.beginPath();hg.arc(x,y,r,0,7);hg.fill();
  }
  const hd=hg.getImageData(0,0,SZ,SZ).data;
  const H=(x,y)=>hd[(((y+SZ)%SZ)*SZ+((x+SZ)%SZ))*4]/255;
  // roughness: bumpy areas rougher
  const rc=document.createElement('canvas');rc.width=rc.height=SZ;
  const rg2=rc.getContext('2d');const ri=rg2.createImageData(SZ,SZ);
  for(let y=0;y<SZ;y++)for(let x=0;x<SZ;x++){
    const v=Math.floor(150+H(x,y)*105);const o=(y*SZ+x)*4;
    ri.data[o]=ri.data[o+1]=ri.data[o+2]=v;ri.data[o+3]=255;
  }
  rg2.putImageData(ri,0,0);
  // metalness: food is dielectric -> near black
  const mc=document.createElement('canvas');mc.width=mc.height=SZ;
  const mg=mc.getContext('2d');mg.fillStyle='#0a0a0a';mg.fillRect(0,0,SZ,SZ);
  // normal: Sobel of height -> RGB
  const nc=document.createElement('canvas');nc.width=nc.height=SZ;
  const ng=nc.getContext('2d');const ni=ng.createImageData(SZ,SZ);
  for(let y=0;y<SZ;y++)for(let x=0;x<SZ;x++){
    const dx=(H(x+1,y)-H(x-1,y))*2,dy=(H(x,y+1)-H(x,y-1))*2;
    const inv=1/Math.hypot(dx,dy,1);const o=(y*SZ+x)*4;
    ni.data[o]=(-dx*inv*.5+.5)*255;ni.data[o+1]=(-dy*inv*.5+.5)*255;
    ni.data[o+2]=(inv*.5+.5)*255;ni.data[o+3]=255;
  }
  ng.putImageData(ni,0,0);
  // AO: radial darkening baked
  const ac=document.createElement('canvas');ac.width=ac.height=SZ;
  const ag=ac.getContext('2d');
  const grd=ag.createRadialGradient(SZ/2,SZ/2,10,SZ/2,SZ/2,SZ*.7);
  grd.addColorStop(0,'#ffffff');grd.addColorStop(1,'#5a5a5a');
  ag.fillStyle=grd;ag.fillRect(0,0,SZ,SZ);
  return {
    roughnessMap:dataTex(rc),metalnessMap:dataTex(mc),
    normalMap:dataTex(nc),aoMap:dataTex(ac),heightCanvas:hc
  };
}
const PBR=makePBRMaps();

/* ================= MATERIALS (PBR: map + roughness + metalness + bump) ================= */
const M={
  floor:new THREE.MeshStandardMaterial({map:floorT.tex,roughness:.92,roughnessMap:PBR.roughnessMap,bumpMap:floorT.tex,bumpScale:.6}),
  wall:new THREE.MeshStandardMaterial({map:wallT.tex,roughness:.95}),
  wood:new THREE.MeshStandardMaterial({map:woodT.tex,roughness:.55}),
  woodDark:new THREE.MeshStandardMaterial({color:0x8a5a28,roughness:.7}),
  steel:new THREE.MeshStandardMaterial({color:0xa8b0b8,roughness:.32,metalness:.75}),
  darkSteel:new THREE.MeshStandardMaterial({color:0x3a3f45,roughness:.5,metalness:.6}),
  oil:new THREE.MeshStandardMaterial({color:0xe09a00,roughness:.15,emissive:0x8a5200,emissiveIntensity:.5}),
  grate:new THREE.MeshStandardMaterial({map:grateT.tex,roughness:.7,metalness:.3}),
  red:new THREE.MeshStandardMaterial({color:0xc93325,roughness:.55}),
  bun:new THREE.MeshStandardMaterial({map:bunT.tex,roughness:.65,
    roughnessMap:PBR.roughnessMap,normalMap:PBR.normalMap,bumpMap:bunT.tex,bumpScale:.4}),
  patty:new THREE.MeshStandardMaterial({color:0x5a2e16,roughness:.95,roughnessMap:PBR.roughnessMap}),
  pattyRaw:new THREE.MeshStandardMaterial({color:0xc25a5a,roughness:.85}),
  lettuce:new THREE.MeshStandardMaterial({color:0x6fbf3a,roughness:.8}),
  cheese:new THREE.MeshStandardMaterial({color:0xffc93c,roughness:.55}),
  fry:new THREE.MeshStandardMaterial({color:0xffd23e,roughness:.7}),
  carton:new THREE.MeshStandardMaterial({map:cartonT.tex,roughness:.7}),
  cup:new THREE.MeshStandardMaterial({map:cupT.tex,roughness:.5}),
  lid:new THREE.MeshStandardMaterial({color:0xff5a5a,roughness:.5}),
  white:new THREE.MeshStandardMaterial({color:0xffffff,roughness:.6}),
  bubble:new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5}),
  trash:new THREE.MeshStandardMaterial({color:0x555b63,roughness:.5,metalness:.6}),
};

/* ================= ROOM ================= */
function box(w,h,d,mat,x,y,z,parent=scene){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
{
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(22,22),M.floor);
  fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;scene.add(fl);
  const bw=new THREE.Mesh(new THREE.PlaneGeometry(14,4),M.wall);
  bw.position.set(0,2,-5.5);bw.receiveShadow=true;scene.add(bw);
  const lw=new THREE.Mesh(new THREE.PlaneGeometry(16,4),M.wall);
  lw.rotation.y=Math.PI/2;lw.position.set(-5.5,2,0);scene.add(lw);
  const rw=lw.clone();rw.rotation.y=-Math.PI/2;rw.position.x=5.5;scene.add(rw);
  const ce=new THREE.Mesh(new THREE.PlaneGeometry(14,16),
    new THREE.MeshStandardMaterial({color:0x2b2118,roughness:1}));
  ce.rotation.x=Math.PI/2;ce.position.y=3.4;scene.add(ce);
  // door
  box(1.7,2.5,.18,M.darkSteel,-3.4,1.25,-5.42);
  box(1.3,2.1,.1,new THREE.MeshStandardMaterial({color:0x9fd8ff,roughness:.2,metalness:.1}),-3.4,1.15,-5.36);
  // pendant lamps (emissive = lit stage)
  [-1.7,0,1.7].forEach(x=>{
    const cord=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.7),M.darkSteel);
    cord.position.set(x,3.05,-.3);scene.add(cord);
    const shade=new THREE.Mesh(new THREE.ConeGeometry(.28,.25,16,1,true),
      new THREE.MeshStandardMaterial({color:0x2e7d32,roughness:.4,metalness:.4,side:THREE.DoubleSide}));
    shade.position.set(x,2.68,-.3);shade.castShadow=true;scene.add(shade);
    const bulb=new THREE.Mesh(new THREE.SphereGeometry(.07,12,10),
      new THREE.MeshStandardMaterial({color:0xfff2cc,emissive:0xffc36b,emissiveIntensity:2.4}));
    bulb.position.set(x,2.6,-.3);scene.add(bulb);
  });
}
// menu board = 3D box + textured face
const menuDraw=canvasTex(512,160,(g)=>{
  g.fillStyle='#1d1d1d';g.fillRect(0,0,512,160);
  g.fillStyle='#ffd54a';g.font='bold 44px system-ui';g.textAlign='center';
  g.fillText('🍟 FRY COOK 🍔',256,62);
  g.fillStyle='#fff';g.font='bold 30px system-ui';
  g.fillText('FRIES  •  BURGERS  •  SODA',256,118);
});
box(4.6,1.3,.16,M.darkSteel,0,2.62,-5.32);
{
  const face=new THREE.Mesh(new THREE.PlaneGeometry(4.4,1.15),
    new THREE.MeshStandardMaterial({map:menuDraw.tex,roughness:.6,emissive:0xffffff,emissiveMap:menuDraw.tex,emissiveIntensity:.35}));
  face.position.set(0,2.62,-5.22);scene.add(face);
}

/* ================= COUNTER + MACHINES ================= */
box(5.4,.9,1.1,M.woodDark,0,.45,.75);
box(5.6,.09,1.3,M.wood,0,.945,.75);
// fryer (left)
const fryer=new THREE.Group();fryer.position.set(-1.75,.99,.75);scene.add(fryer);
{
  const b=new THREE.Mesh(new THREE.BoxGeometry(1.05,.38,.85),M.steel);
  b.position.y=.19;b.castShadow=true;fryer.add(b);
  const oil=new THREE.Mesh(new THREE.BoxGeometry(.88,.07,.68),M.oil);
  oil.position.y=.36;fryer.add(oil);fryer.userData.oil=oil;
  const bk=new THREE.Mesh(new THREE.BoxGeometry(.62,.2,.52),
    new THREE.MeshStandardMaterial({color:0x44484e,roughness:.5,metalness:.5}));
  bk.position.y=.52;bk.castShadow=true;fryer.add(bk);fryer.userData.basket=bk;
}
// grill (center)
const grill=new THREE.Group();grill.position.set(0,.99,.75);scene.add(grill);
let pattyMesh=null;
{
  const b=new THREE.Mesh(new THREE.BoxGeometry(1.15,.38,.9),M.steel);
  b.position.y=.19;b.castShadow=true;grill.add(b);
  const t=new THREE.Mesh(new THREE.BoxGeometry(.98,.06,.73),M.grate);
  t.position.y=.4;grill.add(t);
}
// soda (right)
const sodaM=new THREE.Group();sodaM.position.set(1.75,.99,.75);scene.add(sodaM);
{
  const b=new THREE.Mesh(new THREE.BoxGeometry(.95,1.05,.62),M.red);
  b.position.y=.52;b.castShadow=true;sodaM.add(b);
  const panel=new THREE.Mesh(new THREE.BoxGeometry(.7,.5,.04),M.white);

/* ================= FOOD FACTORIES (geometry→solid→textured→lit) ================= */
function friesMesh(s=1){
  const g=new THREE.Group();
  const c=new THREE.Mesh(new THREE.BoxGeometry(.24*s,.2*s,.15*s),M.carton);
  c.castShadow=true;g.add(c);
  for(let i=0;i<7;i++){
    const f=new THREE.Mesh(new THREE.BoxGeometry(.032*s,.24*s,.032*s),M.fry);
    f.position.set((Math.random()-.5)*.17*s,.17*s,(Math.random()-.5)*.09*s);
    f.rotation.z=(Math.random()-.5)*.3;f.castShadow=true;g.add(f);
  }
  return g;
}
function burgerMesh(s=1){
  const g=new THREE.Group();
  const add=(geo,mat,y)=>{const m=new THREE.Mesh(geo,mat);m.position.y=y;m.castShadow=true;g.add(m);return m;};
  add(new THREE.CylinderGeometry(.17*s,.16*s,.06*s,18),M.bun,0);
  add(new THREE.CylinderGeometry(.175*s,.175*s,.05*s,18),M.patty,.06*s);
  add(new THREE.BoxGeometry(.36*s,.02*s,.36*s),M.lettuce,.095*s);
  add(new THREE.BoxGeometry(.31*s,.016*s,.31*s),M.cheese,.11*s);
  const top=add(new THREE.SphereGeometry(.17*s,18,12,0,Math.PI*2,0,Math.PI/2),M.bun,.115*s);
  top.scale.y=.72;
  return g;
}
function drinkMesh(s=1){
  const g=new THREE.Group();
  const c=new THREE.Mesh(new THREE.CylinderGeometry(.105*s,.08*s,.26*s,16),M.cup);
  c.castShadow=true;g.add(c);
  const l=new THREE.Mesh(new THREE.CylinderGeometry(.11*s,.11*s,.045*s,16),M.lid);
  l.position.y=.14*s;g.add(l);
  const st=new THREE.Mesh(new THREE.CylinderGeometry(.016*s,.016*s,.22*s,8),M.steel);
  st.position.set(.035*s,.22*s,0);st.rotation.z=-.2;g.add(st);
  return g;
}
const foodMesh=(k,s=1)=>k==='fries'?friesMesh(s):k==='burger'?burgerMesh(s):drinkMesh(s);

/* ---- tray (3D plate on counter) ---- */
const trayG=new THREE.Group();trayG.position.set(0,1.03,.1);scene.add(trayG);
{
  const plate=new THREE.Mesh(new THREE.BoxGeometry(1.7,.045,.55),
    new THREE.MeshStandardMaterial({color:0xd8dce0,roughness:.35,metalness:.35}));

function buildHeroBurger(stage){
  clearHero();heroTris=0;
  const parts=burgerPartGeos(stage===8);
  const count=geos=>geos.reduce((a,g)=>a+g.attributes.position.count,0);
  if(stage===1){ // points + blockout
    const pos=[],col=[];
    const palette=[[232,169,78],[90,46,22],[111,191,58],[255,201,60]];
    parts.forEach((p,pi)=>{
      p.geo.computeBoundingBox();const bb=p.geo.boundingBox;
      for(let i=0;i<240;i++){
        const x=bb.min.x+Math.random()*(bb.max.x-bb.min.x);
        const y=bb.min.y+Math.random()*(bb.max.y-bb.min.y)+p.y;
        const z=bb.min.z+Math.random()*(bb.max.z-bb.min.z);
        pos.push(x,y,z);const c=palette[pi%4];col.push(c[0]/255,c[1]/255,c[2]/255);
      }
      const bx=new THREE.Mesh(p.geo,new THREE.MeshBasicMaterial({color:0x33e0ff,transparent:true,opacity:.14,depthWrite:false}));
      bx.position.y=p.y;heroMount.add(bx);
    });
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
    heroMount.add(new THREE.Points(g,new THREE.PointsMaterial({size:.022,vertexColors:true})));
    heroTris=Math.floor(pos.length/3);
  }else if(stage===2){ // wireframe
    parts.forEach(p=>{
      heroAdd(p.geo,new THREE.MeshBasicMaterial({color:0x33e0ff,wireframe:true}),p.y,p.sy);
    });
    const dome=parts[4];
    const ghost=new THREE.Mesh(dome.geo,new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.22}));
    ghost.scale.setScalar(1.02);ghost.position.y=dome.y;heroMount.add(ghost);
    heroTris=count(parts.map(p=>p.geo));
  }else if(stage===3){ // mesh + edges + tri count
    const grey=new THREE.MeshStandardMaterial({color:0xbbbbbb,roughness:.9});

          metalnessMap:PBR.metalnessMap,normalMap:PBR.normalMap,bumpMap:bunT.tex,bumpScale:.4,
          emissive:0x664400,emissiveMap:bunT.tex,emissiveIntensity:stage===13?.35:.08})

    const patM=pbrFull

          metalnessMap:PBR.metalnessMap,normalMap:PBR.normalMap})

// true SkinnedMesh rig (stage 9 + every 5th live customer)
function makeSkinnedArm(shirtMat){
  const geo=new THREE.CylinderGeometry(.13,.11,.6,8,4);
  geo.translate(0,-.3,0);
  const pos=geo.attributes.position,idx=[],wt=[];
  for(let i=0;i<pos.count;i++){
    const y=pos.getY(i),el=y<-.28?1:(y<-.05?.5:0);
    // itemSize 4: three's CPU skinning loop always reads 4 components
    idx.push(el>.5?1:0,0,0,0);wt.push(el>.5?1:(el>0?.5:1),el>.5?0:(el>0?.5:0),0,0);
  }
  geo.setAttribute('skinIndex',new THREE.Uint16BufferAttribute(idx,4));
  geo.setAttribute('skinWeight',new THREE.Float32BufferAttribute(wt,4));
  const mesh=new THREE.SkinnedMesh(geo,shirtMat);
  const shoulder=new THREE.Bone(),elbow=new THREE.Bone();
  elbow.position.set(0,-.3,0);shoulder.add(elbow);mesh.add(shoulder);
  mesh.bind(new THREE.Skeleton([shoulder,elbow]));
  mesh.updateMatrixWorld(true);
  mesh.castShadow=true;mesh.frustumCulled=false;
  return {mesh,shoulder,elbow};
}

/* ================= INPUT: tap 3D objects, drag to look ================= */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
let downXY=null,downT=0;
let pDown=null,dragging=false;
renderer.domElement.addEventListener('pointerdown',e=>{
  downXY=[e.clientX,e.clientY];downT=performance.now();
  pDown=[e.clientX,e.clientY];dragging=true;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(err){}
});
window.addEventListener('pointermove',e=>{
  if(!dragging||!pDown)return;
  if(downXY&&Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1])>14){
    yaw-=(e.clientX-pDown[0])*.0042;
    pitch-=(e.clientY-pDown[1])*.0032;
    yaw=Math.max(-1.25,Math.min(1.25,yaw));pitch=Math.max(-.5,Math.min(.3,pitch));
    applyCam();
  }
  pDown=[e.clientX,e.clientY];
});
window.addEventListener('pointerup',e=>{
  dragging=false;
  if(!downXY)return;
  const moved=Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1]);
  const dtms=performance.now()-downT;downXY=null;
  if(moved>14||dtms>600)return;
  ptr.x=(e.clientX/innerWidth)*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  // start gate first
  if(!S.started){
    if(ray.intersectObject(startG,true).length){
      S.started=true;sfx.ready();toast3D('Cook! Drag right = 🔬 lab!');
      scene.remove(startG);tutBoards.forEach(b=>scene.remove(b));drawScore();return;
    }
    return;
  }
  if(ray.intersectObject(btnFries,true).length){friesAction();return;}
  if(ray.intersectObject(btnBurger,true).length){burgerAction();return;}
  if(ray.intersectObject(btnDrink,true).length){drinkAction();return;}
  if(ray.intersectObject(trashG,true).length){trashAction();return;}
  // pipeline lab controls (diegetic 3D)
  const pipeHit=(b)=>ray.intersectObject(b,true).length;
  if(pipeHit(pipePrev)){pressAnim(pipePrev);pipeNextStage(-1);return;}
  if(pipeHit(pipeNext)){pressAnim(pipeNext);pipeNextStage(1);return;}
  if(pipeHit(pipeLight)){pressAnim(pipeLight);cycleLight();return;}
  if(pipeHit(pipeRender)){pressAnim(pipeRender);cycleRender();return;}
  if(pipeHit(pipePost)){pressAnim(pipePost);
    postOn=!postOn;setBtnLabel(pipePost,postOn?'✨ POST ON':'✨ POST OFF',postOn?'#2e7d32':'#9e9e9e');
    drawPipeReadout();sfx.pop();return;}
  if(pipeHit(pipeSpin)){pressAnim(pipeSpin);PIPELINE.spin=!PIPELINE.spin;sfx.pop();return;}
  if(pipeHit(pipeView)){pressAnim(pipeView);
    if(PIPELINE.mode==='inspect')exitInspect();else enterInspect();return;}
  if(pipeHit(pipeViewBtn)){pressAnim(pipeViewBtn);enterInspect();return;}
  if(pipeHit(pipeHeader)){enterInspect();return;}
  if(PIPELINE.mode==='inspect'&&ray.intersectObject(heroMount,true).length){pipeNextStage(1);return;}
  const chits=ray.intersectObjects(S.customers.map(c=>c.group),true);
  if(chits.length){
    let o=chits[0].object;
    while(o&&!o.userData.customer)o=o.parent;
    const c=o&&o.userData.customer;
    if(c&&(c.state==='waiting'||c.state==='entering'))serveCustomer(c);
  }
});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  if(composer){composer.setSize(innerWidth,innerHeight);bloomPass&&bloomPass.setSize(innerWidth/2,innerHeight/2);}
});

/* ================= PER-FRAME ================= */
const clock=new THREE.Clock();
function stationFrame(st,bar,btn,labels,t){
  if(st.st==='idle'){setBar3D(bar,0,'idle');setBtnLabel(btn,labels[0],'#ff9d1b');}
  else if(st.st==='cooking'){
    const f=st.t/st.cook;setBar3D(bar,f,'cook');
    setBtnLabel(btn,`${Math.ceil(st.cook-st.t)}s…`,'#9e9e9e');
  }
  else if(st.st==='ready'){
    const over=(st.t-st.cook)/st.burn;
    setBar3D(bar,1-over,'ready');
    const blink=Math.floor(performance.now()/400)%2===0;
    setBtnLabel(btn,labels[1],blink?'#4caf50':'#2e7d32');
  }
  else{setBar3D(bar,1,'burn');setBtnLabel(btn,labels[2],'#b71c1c');}
}
let lastLabelState='';
function update(dt){
  if(S.started){
    const F=S.fries,B=S.burger,D=S.drink;
    if(F.st==='cooking'){F.t+=dt;if(F.t>=F.cook){F.st='ready';sfx.ready();toast3D('🍟 Fries ready! Tap!');}}
    else if(F.st==='ready'){F.t+=dt;if(F.t>=F.cook+F.burn){F.st='burnt';sfx.bad();toast3D('🔥 Fries burnt! Dump it');}}
    if(B.st==='cooking'){B.t+=dt;
      if(pattyMesh)pattyMesh.material=B.t>B.cook*.5?M.patty:M.pattyRaw;
      if(B.t>=B.cook){B.st='ready';sfx.ready();toast3D('🍔 Patty done! Assemble!');if(pattyMesh)pattyMesh.material=M.patty;}}
    else if(B.st==='ready'){B.t+=dt;if(B.t>=B.cook+B.burn){B.st='burnt';sfx.bad();toast3D('🔥 Patty burnt! Dump it');}}
    if(D.st==='cooking'){D.t+=dt;if(D.t>=D.cook){D.st='ready';sfx.ready();toast3D('🥤 Drink ready! Tap!');}}
    else if(D.st==='ready'){D.t+=dt;if(D.t>=D.cook+D.burn){D.st='burnt';sfx.bad();toast3D('🥤 Soda flat! Dump it');}}
    // machine feedback = lit stage
    fryer.userData.basket.position.y=.52+(F.st==='cooking'?Math.sin(performance.now()*.02)*.025:0);
    M.oil.emissiveIntensity=F.st==='cooking'?.9+Math.sin(performance.now()*.01)*.25:.5;
    grillGlow.intensity=B.st==='cooking'?2+Math.sin(performance.now()*.008)*1:(B.st==='ready'?1:0);
    S.spawnT-=dt;
    if(S.spawnT<=0){spawnCustomer();
      S.spawnT=6+Math.random()*7-Math.min(3,S.served*.15);}
    const key=F.st+B.st+D.st;
    if(key!==lastLabelState)lastLabelState=key;
    stationFrame(F,barFries,btnFries,['DROP FRIES','COLLECT 🍟','DUMP 🔥']);
    stationFrame(B,barBurger,btnBurger,['GRILL PATTY','ASSEMBLE 🍔','DUMP 🔥']);
    stationFrame(D,barDrink,btnDrink,['FILL DRINK','COLLECT 🥤','DUMP 🔥']);
  }
  updateButtons(dt);
  // pipeline lab life: hero spin, rigged elbow demo, view-button pulse
  if(PIPELINE.spin&&heroMount.visible)heroMount.rotation.y+=dt*.6;
  if(heroRig)heroRig.elbow.rotation.z=Math.sin(performance.now()*.002)*.6;
  swatchG.rotation.y+=dt*.4;
  pipeViewBtn.lookAt(camera.position);
  pipeViewBtn.position.y=2.3+Math.sin(performance.now()*.003)*.06;
  // toast fade
  if(toastTimer>0){toastTimer-=dt;
    if(toastTimer<=0)toastMesh.material.opacity=0;
    else if(toastTimer<.6)toastMesh.material.opacity=toastTimer/.6;}
  toastMesh.lookAt(camera.position);
  // trash plate always faces camera
  trashG.userData.plate.lookAt(camera.position);
  // customers
  for(let i=S.customers.length-1;i>=0;i--){
    const c=S.customers[i],g=c.group;
    c.phase+=dt*(c.state==='entering'||c.state==='leaving'?9:2.5);
    const sw=Math.sin(c.phase)*.5;
    if(c.state==='entering'){
      const d=c.target.clone().sub(g.position);d.y=0;
      const dist=d.length();
      if(dist<.09){c.state='waiting';}
      else{d.normalize();g.position.addScaledVector(d,Math.min(dist,c.speed*dt));}
      g.position.y=Math.abs(Math.sin(c.phase))*.05;
      c.legL.rotation.x=sw*.8;c.legR.rotation.x=-sw*.8;
      c.armL.rotation.x=-sw*.6;
      if(c.rigBones)c.rigBones.elbow.rotation.z=Math.sin(c.phase)*.55;
      else c.armR.rotation.x=sw*.6;
      g.lookAt(camera.position.x,0,camera.position.z);
    }else if(c.state==='waiting'){
      c.t+=dt;c.patience=Math.max(0,1-c.t/c.maxTime);
      g.position.y=Math.sin(c.phase)*.02;
      c.legL.rotation.x*=.9;c.legR.rotation.x*=.9;
      c.armL.rotation.x=Math.sin(c.phase)*.08;
      if(c.rigBones)c.rigBones.elbow.rotation.z=Math.sin(c.phase*1.2)*.5;
      else c.armR.rotation.x=-Math.sin(c.phase)*.08;
      g.lookAt(camera.position.x,.9,camera.position.z);
      // 3D patience bar shrink + color
      const f=Math.max(.001,c.patience);
      c.pfill.scale.x=f;c.pfill.position.x=-(1-f)*(c.bubW-.16)/2;
      const col=c.patience>.5?0x4caf50:c.patience>.25?0xff9800:0xf44336;
      c.pfill.material.color.set(col);c.pfill.material.emissive.set(col);
      if(c.patience<=0){
        c.state='leaving';c.happy=-1;sfx.bad();toast3D('😡 Customer stormed out!');
        const x=new THREE.Mesh(new THREE.OctahedronGeometry(.16),
          new THREE.MeshStandardMaterial({color:0xff3b30,emissive:0x770000,emissiveIntensity:.8}));
        x.position.set(0,.05,.15);c.bub.add(x);
        c.bub.children.forEach(o=>{if(o!==x&&o.geometry&&o.geometry.type!=='BoxGeometry'&&o.geometry.type!=='ConeGeometry'&&o!==c.pfill)o.visible=false;});
      }
    }else{ // leaving (happy jump or angry stomp)
      const dest=c.happy>0?EXITP:DOOR;
      const d=dest.clone().sub(g.position);d.y=0;
      const dist=d.length();
      if(dist<.4||c.t>8){scene.remove(g);S.customers.splice(i,1);continue;}
      c.t+=dt;d.normalize();g.position.addScaledVector(d,(c.happy>0?2.3:1.8)*dt);
      g.position.y=c.happy>0?Math.abs(Math.sin(c.phase*1.4))*.12:Math.abs(Math.sin(c.phase))*.04;
      c.legL.rotation.x=sw;c.legR.rotation.x=-sw;
      c.armL.rotation.x=c.happy>0?-2.4+Math.sin(c.phase)*.3:-sw*.6;
      if(c.rigBones)c.rigBones.elbow.rotation.z=Math.sin(c.phase*1.4)*.7;
      else c.armR.rotation.x=c.happy>0?-2.4-Math.sin(c.phase)*.3:sw*.6;
      if(c.star)c.star.rotation.y+=dt*4;
      g.lookAt(g.position.x+d.x,0,g.position.z+d.z);
    }
    // bubble always faces camera (still a 3D object, not a sprite)
    c.bub.lookAt(camera.position);
  }
}
function loop(){
  requestAnimationFrame(loop);
  update(Math.min(.05,clock.getDelta()));
  if(postOK&&composer&&postOn)composer.render();
  else renderer.render(scene,camera);
}
loop();
</script>
