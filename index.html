<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Playback — A Century of Sound. A static music streaming website: search millions of songs, spin radio dials, build crates and mixtapes.">
<title>Playback — A Century of Sound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&family=Caveat&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2314100b'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23d4a24c' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23d4a24c'/%3E%3C/svg%3E">
</head>
<body data-era="home">
<div id="boot"><div style="text-align:center"><div class="ring"></div><h1 class="brand">Playback</h1><div class="mono">A CENTURY OF SOUND</div></div></div>
<div id="lost" class="mono" role="status">SIGNAL LOST</div>
<div class="app" id="app">
  <header class="top">
    <span class="brand">Playback</span>
    <input id="q" placeholder="Search songs, artists, albums…" aria-label="Search" autocomplete="off" spellcheck="false">
    <span class="live mono"><i></i><span id="status">ON AIR</span></span>
    <button data-a="go" data-v="7" aria-label="Settings" style="font-size:20px">⚙</button>
  </header>
  <nav id="nav" aria-label="Eras"></nav>
  <main id="main" aria-live="polite"></main>
  <aside id="np" aria-label="Now playing">
    <button class="back mono" data-a="full">◄ BACK</button>
    <div class="mono" style="text-align:center;margin-bottom:10px">NOW PLAYING</div>
    <div class="ringwrap">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="none" stroke="#2e2318" stroke-width="2"/><circle id="ring" cx="50" cy="50" r="47" fill="none" stroke="#d4a24c" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="295.3" stroke-dashoffset="295.3"/></svg>
      <div class="disc" id="disc"></div>
      <div class="arm"></div>
    </div>
    <div style="text-align:center;margin-top:12px"><div class="brand" id="npT" style="font-size:18px;letter-spacing:.04em">Nothing playing</div><div class="mono" id="npA"></div></div>
    <div class="ctl">
      <button data-a="prev" aria-label="Previous">⏮</button>
      <button class="pp" id="pp2" data-a="toggle" aria-label="Play or pause">▶</button>
      <button data-a="next" aria-label="Next">⏭</button>
    </div>
    <div class="bars" id="bars" aria-hidden="true"></div>
    <div class="mono tabsb"><button data-a="tab" data-v="q" id="tq" class="on">QUEUE</button><button data-a="tab" data-v="l" id="tl">LYRICS</button></div>
    <div class="q" id="queue"></div>
    <pre class="lyr" id="lyr"></pre>
  </aside>
  <footer class="mini" id="mini">
    <div class="sw" id="mSw"></div>
    <div class="info" data-a="full"><b id="mT">Nothing playing</b><div class="mono" id="mA"></div></div>
    <div class="reels"><div class="reel"></div><div class="reel"></div></div>
    <div class="ctl" style="margin:0">
      <button data-a="prev" aria-label="Previous">⏮</button>
      <button class="pp" id="pp" data-a="toggle" aria-label="Play or pause">▶</button>
      <button data-a="next" aria-label="Next">⏭</button>
    </div>
    <div class="bar"><span class="mono" id="cur">0:00</span><input type="range" id="seek" min="0" max="100" value="0" aria-label="Seek"><span class="mono" id="dur">0:00</span></div>
  </footer>
  <div class="tabs" id="tabs"></div>
</div>
<audio id="au" preload="auto" crossorigin="anonymous"></audio>
<script src="app.js"></script>
</body>
</html>
